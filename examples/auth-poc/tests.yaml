- key: test_valid_login_succeeds
  display_name: test_valid_login_succeeds
  kind: test
  language: rust
  description: "R1 constraint: the generic error is only for failures; valid credentials authenticate"
  signature: ""
  body: |
    let mut store = UserStore::new();
    store.add_user("alice", "correct horse");
    assert_eq!(
        verify_credentials(&store, "alice", "correct horse"),
        AuthResult::Authenticated {
            username: "alice".to_string()
        }
    );


- key: test_hashes_are_salted_argon2id
  display_name: test_hashes_are_salted_argon2id
  kind: test
  language: rust
  description: "R2 example: same password hashed twice → different Argon2id hashes, both verify"
  signature: ""
  body: |
    let a = hash_password("hunter2");
    let b = hash_password("hunter2");
    assert_ne!(a, b);
    assert!(a.starts_with("$argon2id$"));
    assert!(verify_password("hunter2", &a));
    assert!(verify_password("hunter2", &b));
    assert!(!verify_password("hunter3", &a));


