# Test nodes (docs/ontology.md `tests`), same shape as code.yaml.


# ------------------------------------------------------------------ Rust tests (from requirements)
- key: test_unknown_user_is_invalid
  display_name: test_unknown_user_is_invalid
  kind: test
  language: rust
  description: "R1 example: unknown user → invalid_credentials"
  signature: ""
  body: |
    let mut store = UserStore::new();
    store.add_user("alice", "correct horse");
    assert_eq!(
        verify_credentials(&store, "bob", "correct horse"),
        AuthResult::InvalidCredentials
    );


- key: test_wrong_password_is_invalid
  display_name: test_wrong_password_is_invalid
  kind: test
  language: rust
  description: "R1 example: wrong password → invalid_credentials"
  signature: ""
  body: |
