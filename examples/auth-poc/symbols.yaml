# ------------------------------------------------------------------ Rust: credential-verification
- key: AuthResult
  display_name: AuthResult
  kind: enum
  language: rust
  description: Outcome of a credential check. Failures are deliberately indistinguishable.
  signature: ""
  body: |
    Authenticated { username: String },
    InvalidCredentials,
  attributes:
    derives: [Debug, Clone, PartialEq, Eq]
    item_attrs: ['#[serde(rename_all = "snake_case")]']

- key: User
  display_name: User
  kind: class
  language: rust
  description: A stored user record. Only the password hash is kept.
  signature: ""
  body: |
    pub username: String,
    pub password_hash: String,
  attributes:
    derives: [Debug, Clone, Default, PartialEq, Eq]

- key: UserStore
  display_name: UserStore
  kind: class
  language: rust
  description: In-memory user store for the pilot.
  signature: ""
  body: |
    pub users: HashMap<String, User>,
  attributes:
    derives: [Debug, Clone, Default]
    uses: [std::collections::HashMap]

- key: UserStore-new
  display_name: UserStore::new
  kind: function
  language: rust
  signature: "() -> Self"
  body: |
    Self::default()

- key: UserStore-add_user
  display_name: UserStore::add_user
  kind: function
  language: rust
  description: Register a user, storing only an Argon2id hash of the password.
  signature: "(&mut self, username: &str, password: &str)"
  body: |
    let user = User {
        username: username.to_string(),
        password_hash: hash_password(password),
        ..Default::default()
    };
    self.users.insert(username.to_string(), user);

- key: UserStore-find_user
  display_name: UserStore::find_user
  kind: function
  language: rust
  signature: "(&self, username: &str) -> Option<User>"
  body: |
    self.users.get(username).cloned()

- key: verify_credentials
  display_name: verify_credentials
  kind: function
  language: rust
  description: Check a username/password pair; every failure is the same generic result.
  signature: "(store: &UserStore, username: &str, password: &str) -> AuthResult"
  body: |
    match store.find_user(username) {
        Some(user) if verify_password(password, &user.password_hash) => {
            AuthResult::Authenticated {
                username: user.username,
            }
        }
        _ => AuthResult::InvalidCredentials,
    }

# ------------------------------------------------------------------ Rust tests (from requirements)
- key: test_unknown_user_is_invalid
  display_name: test_unknown_user_is_invalid
  kind: test
  language: rust
  description: "R1 example: unknown user → invalid_credentials"
  signature: ""
  body: |
    let mut store = UserStore::new();
    store.add_user("alice", "correct horse");
    assert_eq!(
        verify_credentials(&store, "bob", "correct horse"),
        AuthResult::InvalidCredentials
    );

- key: test_wrong_password_is_invalid
  display_name: test_wrong_password_is_invalid
  kind: test
  language: rust
  description: "R1 example: wrong password → invalid_credentials"
  signature: ""
  body: |
    let mut store = UserStore::new();
    store.add_user("alice", "correct horse");
    assert_eq!(
        verify_credentials(&store, "alice", "wrong"),
        AuthResult::InvalidCredentials
    );

- key: test_empty_username_is_invalid
  display_name: test_empty_username_is_invalid
  kind: test
  language: rust
  description: "R1 edge case: empty username → invalid_credentials"
  signature: ""
  body: |
    let mut store = UserStore::new();
    store.add_user("alice", "correct horse");
    assert_eq!(
        verify_credentials(&store, "", "anything"),
        AuthResult::InvalidCredentials
    );

- key: test_valid_login_succeeds
  display_name: test_valid_login_succeeds
  kind: test
  language: rust
  description: "R1 constraint: the generic error is only for failures; valid credentials authenticate"
  signature: ""
  body: |
    let mut store = UserStore::new();
    store.add_user("alice", "correct horse");
    assert_eq!(
        verify_credentials(&store, "alice", "correct horse"),
        AuthResult::Authenticated {
            username: "alice".to_string()
        }
    );

- key: test_hashes_are_salted_argon2id
  display_name: test_hashes_are_salted_argon2id
  kind: test
  language: rust
  description: "R2 example: same password hashed twice → different Argon2id hashes, both verify"
  signature: ""
  body: |
    let a = hash_password("hunter2");
    let b = hash_password("hunter2");
    assert_ne!(a, b);
    assert!(a.starts_with("$argon2id$"));
    assert!(verify_password("hunter2", &a));
    assert!(verify_password("hunter2", &b));
    assert!(!verify_password("hunter3", &a));

# ------------------------------------------------------------------ Python: credential-verification
- key: py-demo_users
  display_name: demo_users
  kind: function
  language: python
  tags: [stub]
  description: Pilot stand-in for a user database (dev stub). Cached per process.
  signature: "() -> dict[str, str]"
  body: |
    cache = getattr(demo_users, "_cache", None)
    if cache is None:
        cache = {"alice": PasswordHasher().hash("wonderland")}
        demo_users._cache = cache
    return cache
  attributes:
    imports: ["from argon2 import PasswordHasher"]
    packages: ["argon2-cffi"]

- key: py-authenticate
  display_name: authenticate
  kind: function
  language: python
  description: Python port of verify_credentials over a username → hash mapping.
  signature: "(users: dict[str, str], username: str, password: str) -> str"
  body: |
    stored = users.get(username)
    if not username or stored is None:
        return "invalid_credentials"
    try:
        PasswordHasher().verify(stored, password)
    except Exception:
        return "invalid_credentials"
    return "authenticated"
  attributes:
    imports: ["from argon2 import PasswordHasher"]
    packages: ["argon2-cffi"]

- key: py-login
  display_name: login
  kind: function
  language: python
  description: Public login entry point. Never says which credential failed.
  signature: "(username: str, password: str) -> dict"
  body: |
    if authenticate(demo_users(), username, password) == "authenticated":
        return {"ok": True, "username": username}
    return {"ok": False, "error": "invalid_credentials"}

- key: py-test_login_unknown_user
  display_name: test_login_unknown_user
  kind: test
  language: python
  description: "R1 example: unknown user → invalid_credentials"
  signature: ""
  body: |
    assert login("mallory", "wonderland") == {"ok": False, "error": "invalid_credentials"}

- key: py-test_login_wrong_password
  display_name: test_login_wrong_password
  kind: test
  language: python
  description: "R1 example: wrong password → invalid_credentials"
  signature: ""
  body: |
    assert login("alice", "nope") == {"ok": False, "error": "invalid_credentials"}

- key: py-test_login_empty_username
  display_name: test_login_empty_username
  kind: test
  language: python
  description: "R1 edge case: empty username → invalid_credentials"
  signature: ""
  body: |
    assert login("", "wonderland") == {"ok": False, "error": "invalid_credentials"}

- key: py-test_login_success
  display_name: test_login_success
  kind: test
  language: python
  description: Valid credentials authenticate.
  signature: ""
  body: |
    assert login("alice", "wonderland") == {"ok": True, "username": "alice"}
