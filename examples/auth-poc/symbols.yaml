# Code symbols. `signature` is name-free; the renderer composes `<display name><signature>`.
# Bodies are stored unindented, without the enclosing braces / `def` line.

# ------------------------------------------------------------------ Rust: password-hashing
- key: hash_password
  display_name: hash_password
  kind: function
  language: rust
  description: Hash a password with Argon2id and a fresh random salt.
  signature: "(password: &str) -> String"
  body: |
    let salt = SaltString::generate(&mut OsRng);
    Argon2::default()
        .hash_password(password.as_bytes(), &salt)
        .expect("argon2 hashing with default parameters cannot fail")
        .to_string()
  attributes:
    crates:
      argon2: "0.5.3"
      rand_core: { version: "0.6", features: [getrandom] }
    uses:
      - argon2::Argon2
      - argon2::password_hash::{PasswordHasher, SaltString}
      - rand_core::OsRng

- key: verify_password
  display_name: verify_password
  kind: function
  language: rust
  description: Check a password against an Argon2 PHC hash string.
  signature: "(password: &str, hash: &str) -> bool"
  body: |
    match PasswordHash::new(hash) {
        Ok(parsed) => Argon2::default()
            .verify_password(password.as_bytes(), &parsed)
            .is_ok(),
        Err(_) => false,
    }
  attributes:
    crates: { argon2: "0.5.3" }
    uses:
      - argon2::Argon2
      - argon2::password_hash::{PasswordHash, PasswordVerifier}

# Planted fixture (doc 08): exact duplicate of verify_password under another name.
