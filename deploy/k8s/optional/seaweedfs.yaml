# SeaweedFS (Apache 2.0) as the self-hosted S3 cold tier behind kodehub-storage (D-054).
# Optional: applied by `KODEHUB_STORAGE_BACKEND=seaweedfs scripts/k8s.sh deploy` (and by
# `scripts/k8s.sh seaweed-check`), not by a plain deploy. One pod in single-server mode
# (master + volume + filer + S3 gateway); the S3 identity comes from the `seaweedfs-s3` secret,
# which k8s.sh generates. Only kodehub-storage talks to it; nothing else holds the keys.
apiVersion: v1
kind: Service
metadata: { name: seaweedfs-s3, namespace: kodehub }
spec:
  selector: { app: seaweedfs }
  ports: [{ name: s3, port: 8333, targetPort: 8333 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: seaweedfs-data, namespace: kodehub }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: seaweedfs, namespace: kodehub }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: seaweedfs } }
  template:
    metadata: { labels: { app: seaweedfs } }
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.97
          imagePullPolicy: IfNotPresent
          args:
            - server
            - -dir=/data
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB=1024
            - -volume.max=0
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
          ports: [{ containerPort: 8333 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8333 }, periodSeconds: 2 }
          resources: { requests: { cpu: 100m, memory: 128Mi } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3-config, mountPath: /etc/seaweedfs, readOnly: true }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: seaweedfs-data } }
        - { name: s3-config, secret: { secretName: seaweedfs-s3 } }
