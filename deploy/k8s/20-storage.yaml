# Storage service (spec §3.4). Pilot default: local mode on a volume. The mode and upstream come
# from the `storage-profile` ConfigMap and `storage-upstream` Secret that scripts/k8s.sh writes:
# KODEHUB_STORAGE_BACKEND=seaweedfs selects hybrid mode with SeaweedFS as the cold tier (D-054);
# for AWS S3 or another S3 store, put its KODEHUB_STORAGE_UPSTREAM_* values in those two.
apiVersion: v1
kind: Service
metadata: { name: storage, namespace: kodehub }
spec:
  type: NodePort
  selector: { app: storage }
  ports: [{ name: http, port: 9000, targetPort: 9000, nodePort: 30900 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: storage-data, namespace: kodehub }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: storage, namespace: kodehub }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: storage } }
  template:
    metadata: { labels: { app: storage } }
    spec:
      securityContext: { fsGroup: 10001 }
      containers:
        - name: storage
          image: kodehub/kodehub:dev
          imagePullPolicy: Never
          command: ["kodehub-storage"]
          envFrom:
            - configMapRef: { name: storage-profile, optional: true }
            - secretRef: { name: storage-upstream, optional: true }
          env:
            - { name: KODEHUB_STORAGE_DIR, value: /data/objects }
            - name: KODEHUB_STORAGE_TOKEN
              valueFrom: { secretKeyRef: { name: kodehub-secrets, key: storage-token } }
          ports: [{ containerPort: 9000 }]
          readinessProbe: { httpGet: { path: /health, port: 9000 }, periodSeconds: 2 }
          resources: { requests: { cpu: 50m, memory: 64Mi } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: storage-data } }]
