# ArangoDB: the single source of truth (spec §3.1).
apiVersion: v1
kind: Service
metadata: { name: arangodb, namespace: kodehub }
spec:
  type: NodePort
  selector: { app: arangodb }
  ports: [{ name: http, port: 8529, targetPort: 8529, nodePort: 30529 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: arangodb, namespace: kodehub }
spec:
  serviceName: arangodb
  replicas: 1
  selector: { matchLabels: { app: arangodb } }
  template:
    metadata: { labels: { app: arangodb } }
    spec:
      containers:
        - name: arangodb
          image: arangodb:3.12
          imagePullPolicy: Never
          env:
            - name: ARANGO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: kodehub-secrets, key: arango-password } }
          ports: [{ containerPort: 8529 }]
          readinessProbe:
            httpGet: { path: /_admin/server/availability, port: 8529 }
            periodSeconds: 2
            failureThreshold: 90
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
          volumeMounts: [{ name: data, mountPath: /var/lib/arangodb3 }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
