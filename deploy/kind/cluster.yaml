# Kind cluster for a laptop (spec §3). Host ports: 18529 ArangoDB, 17878 Kodehub server/UI,
# 19000 storage service. Images are loaded with `kind load`, never pulled from a registry.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kodehub
nodes:
  - role: control-plane
    image: kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4
    extraPortMappings:
      - { containerPort: 30529, hostPort: 18529, listenAddress: "127.0.0.1" }
      - { containerPort: 30878, hostPort: 17878, listenAddress: "127.0.0.1" }
      - { containerPort: 30900, hostPort: 19000, listenAddress: "127.0.0.1" }
