[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
kodehub-core = { path = "crates/kodehub-core" }
kodehub-store = { path = "crates/kodehub-store" }
kodehub-render = { path = "crates/kodehub-render" }
kodehub-runner = { path = "crates/kodehub-runner" }
kodehub-agents = { path = "crates/kodehub-agents" }
kodehub-storage = { path = "crates/kodehub-storage" }
kodehub-worker = { path = "crates/kodehub-worker" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
blake3 = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
futures = "0.3"
async-trait = "0.1"
regex = "1"
tempfile = "3"
portable-pty = "0.9"
base64 = "0.22"
libc = "0.2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
tar = "0.4"
rusty-s3 = "0.7"
bytes = "1"
url = "2"
syn = { version = "2", features = ["full", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[profile.dev.package."*"]
opt-level = 1
